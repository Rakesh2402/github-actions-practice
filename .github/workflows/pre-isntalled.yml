name: ubuntu preinstalled tool info

on:
  push:
    branches: [main] 


jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:

      - name: print tools version
        run: |
          echo "Docker version:"
          docker --version
          echo "Python version:"
          python --version
          echo "Node version:"
          node --version
          echo "Git version:"
          git --version