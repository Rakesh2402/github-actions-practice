name: artifact-between-jobs
on:
 workflow_dispatch:


jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: Generate a file
              run: |
                echo "This file was generated by GitHub Actions" > job1.txt
            - name: Upload generated file
              uses: actions/upload-artifact@v4
              with:
               name: my-generated-files  # The name shown in GitHub UI
               path: job1.txt   # Path to the file or directory

    job2: 
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Download the file of job1
              uses: actions/download-artifact@v4
              with:
               name: job1 file              # Must match the upload name
               path: ./downloaded-files            # Destination directory

            - name: Use the file
              run: |
               echo "Reading artifact file:"
               cat ./downloaded-files/job1.txt