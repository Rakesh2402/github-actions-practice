name: docker secrets
on:
    workflow_dispatch

jobs:
    test-secret:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              run: actions/checkout@v4

            - name: login to docker
              env:
                DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
                DOCKER_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
              
              run: |
               echo "Docker username is : $DOCKERHUB_USERNAME"
               echo "loggin to dockerhub"
