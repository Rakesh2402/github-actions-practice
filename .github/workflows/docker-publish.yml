name: Docker Publish

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-prod-app:latest .

      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/flask-prod-app:latest \
          ${{ secrets.DOCKER_USERNAME }}/flask-prod-app:sha-${SHORT_SHA}

      - name: Push latest tag
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-prod-app:latest

      - name: Push SHA tag
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-prod-app:sha-${SHORT_SHA}