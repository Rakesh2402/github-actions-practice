name: upload artifact
on:
    workflow_dispatch
    
jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate a file
        run: |
          mkdir -p output
          echo "This file was generated by GitHub Actions" > output/sample.txt

      - name: Upload generated file
        uses: actions/upload-artifact@v4
        with:
          name: my-generated-files  # The name shown in GitHub UI
          path: output/sample.txt   # Path to the file or directory